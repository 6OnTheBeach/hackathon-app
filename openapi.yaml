openapi: 3.1.0
info:
  title: API Givaudan Scent Journey
  version: 0.2.0
  description: >-
    Scent Journey : le client raconte un souvenir, l'IA en tire une
    compréhension, une signature olfactive, une roue des familles et un profil
    (notes de tête, de cœur et de fond).

servers:
  - url: http://localhost:3000/api
    description: API dans le dev container (npm run dev)
  - url: http://localhost:3001/api
    description: API de la stack docker compose

paths:
  /health:
    get:
      summary: État de l'API et de la base de données
      description: Interroge PostgreSQL (SELECT version()).
      responses:
        '200':
          description: L'API et la base répondent
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, const: ok }
                  db:
                    type: string
                    description: La version de PostgreSQL, telle que renvoyée par SELECT version()
                    examples:
                      - 'PostgreSQL 17.6 on x86_64-pc-linux-gnu, compiled by gcc …'
        '503':
          description: La base de données ne répond pas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /journeys:
    post:
      summary: Créer un parcours Scent Journey
      description: Un parcours anonyme, qui regroupe les souvenirs racontés par le client.
      responses:
        '201':
          description: Le parcours créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journey' }

  /journeys/{id}/messages:
    post:
      summary: Raconter un souvenir et obtenir son analyse par l'IA
      description: >-
        Enregistre le souvenir, l'envoie à l'IA, enregistre sa réponse et
        renvoie le message complet. L'IA peut mettre plus de 20 secondes à
        répondre (délai maximum : 120 s). Si l'IA échoue, le souvenir reste
        enregistré sans analyse et la réponse est une 502.
      parameters:
        - name: id
          in: path
          required: true
          description: L'identifiant du parcours
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: Le souvenir, tel que raconté par le client (espaces de début et de fin retirés)
                  examples:
                    - "Une forêt tropicale juste après l'averse, la terre humide et les fleurs qui s'ouvrent."
      responses:
        '201':
          description: Le message enregistré, avec l'analyse de l'IA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          description: Identifiant ou corps invalide (texte vide, trop long, JSON mal formé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Parcours inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: L'IA est injoignable, trop lente, ou a renvoyé une réponse invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    Error:
      type: object
      required: [status, error]
      properties:
        status: { type: string, const: error }
        error:
          type: string
          description: Message lisible, sans détail technique interne

    Journey:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    Message:
      type: object
      required: [id, journeyId, text, createdAt, model, analysis]
      properties:
        id: { type: string, format: uuid }
        journeyId: { type: string, format: uuid }
        text: { type: string, description: Le souvenir raconté }
        createdAt: { type: string, format: date-time }
        model:
          type: string
          description: Le modèle qui a produit l'analyse (« mock » pour le fournisseur fictif)
        analysis: { $ref: '#/components/schemas/Analysis' }

    Analysis:
      type: object
      description: >-
        L'analyse du souvenir par l'IA (champ answer du service Data/IA).
        comprehension, signature et roue sont obligatoires ; profil est
        facultatif ; les listes et le brief absents valent [] et "".
      required:
        [
          comprehension,
          signature,
          roue,
          limites_catalogue,
          informations_manquantes,
          brief,
        ]
      properties:
        comprehension: { $ref: '#/components/schemas/Comprehension' }
        signature: { $ref: '#/components/schemas/Signature' }
        roue:
          type: array
          description: Les familles olfactives et leur part, en pourcentage
          items: { $ref: '#/components/schemas/RoueEntry' }
        profil: { $ref: '#/components/schemas/Profil' }
        limites_catalogue:
          type: array
          items: { type: string }
        informations_manquantes:
          type: array
          items: { type: string }
        brief: { type: string }

    Comprehension:
      type: object
      required: [lieu, moment, meteo, emotion, elements]
      properties:
        lieu: { type: string }
        moment: { type: string }
        meteo: { type: string }
        emotion: { type: string }
        elements:
          type: array
          items: { type: string }

    Signature:
      type: object
      required: [nom, description]
      properties:
        nom: { type: string }
        description: { type: string }

    RoueEntry:
      type: object
      required: [famille, pourcentage]
      properties:
        famille:
          type: string
          examples: [Green]
        pourcentage: { type: number }

    Profil:
      type: object
      required: [tete, coeur, fond]
      properties:
        tete:
          type: array
          items: { $ref: '#/components/schemas/ProfilNote' }
        coeur:
          type: array
          items: { $ref: '#/components/schemas/ProfilNote' }
        fond:
          type: array
          items: { $ref: '#/components/schemas/ProfilNote' }

    ProfilNote:
      type: object
      required: [ingredient, reference, raison, sources]
      properties:
        ingredient: { type: string }
        reference: { type: string }
        raison: { type: string }
        sources:
          type: array
          items: { type: string }
