# La stack de développement. Versions figées : les mêmes qu'en production.
name: hackathonsix

services:
  # Le poste de travail : VS Code s'y attache, on y lance l'API et le front
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspace:cached
      - claude-config:/home/node/.claude
    # host.docker.internal : la machine hôte, où tourne le service Data/IA
    # (déjà fourni par Docker Desktop, à déclarer sous Docker Engine Linux)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # L'API, construite depuis api/Dockerfile. Applique les migrations Drizzle
  # au démarrage, une fois la base prête.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    environment:
      # Identifiants de dev locaux, les mêmes que le service db : pas un secret
      DATABASE_URL: postgres://app:app@db:5432/app
      # IA : mock par défaut ; AI_PROVIDER=data docker compose up pour appeler
      # le service Data/IA, lancé sur l'hôte (uvicorn … --host 0.0.0.0)
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DATA_AI_URL: ${DATA_AI_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # 3001 sur la machine : 3000 reste libre pour npm run dev (dev container)
      - '3001:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Le front, construit depuis web/Dockerfile et servi par vite preview,
  # qui relaie /api vers le service api
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    init: true
    environment:
      API_URL: http://api:3000
    ports:
      # 8080 sur la machine : 5173 reste libre pour npm run dev (dev container)
      - '8080:4173'
    depends_on:
      api:
        condition: service_healthy
# Volumes nommés, gérés par Docker
volumes:
  # Connexion et réglages de Claude Code, conservés entre deux rebuilds
  claude-config:
